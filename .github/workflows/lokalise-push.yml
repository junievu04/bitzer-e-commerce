# Push translation files (languages/*.json) to Lokalise when pushing to main
# Chạy thủ công: Actions → Push to Lokalise → Run workflow
# Hoặc tự động khi push lên main
name: Push to Lokalise

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/**"
      - "src/**"

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync i18n keys from code
        run: npm run sync-keys

      - name: Commit updated language files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/en.json languages/vi.json
          git diff --staged --quiet || git commit -m "chore: sync i18n keys [skip ci]"
          git push

      - name: Push vi.json to Lokalise
        run: |
          RESPONSE=$(curl -s -o /tmp/vi_response.json -w "%{http_code}" \
            -X POST "https://api.lokalise.com/api2/projects/${{ vars.LOKALISE_PROJECT_ID }}/files/upload" \
            -H "X-Api-Token: ${{ secrets.LOKALISE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"data\": \"$(base64 -w 0 languages/vi.json)\",
              \"filename\": \"vi.json\",
              \"lang_iso\": \"vi\",
              \"replace_modified\": true,
              \"format\": \"json\"
            }")
          echo "HTTP status: $RESPONSE"
          cat /tmp/vi_response.json
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "201" ]; then
            echo "❌ Failed to push vi.json"
            exit 1
          fi
          echo "✅ vi.json pushed successfully"

      - name: Push en.json to Lokalise
        run: |
          RESPONSE=$(curl -s -o /tmp/en_response.json -w "%{http_code}" \
            -X POST "https://api.lokalise.com/api2/projects/${{ vars.LOKALISE_PROJECT_ID }}/files/upload" \
            -H "X-Api-Token: ${{ secrets.LOKALISE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"data\": \"$(base64 -w 0 languages/en.json)\",
              \"filename\": \"en.json\",
              \"lang_iso\": \"en\",
              \"replace_modified\": true,
              \"format\": \"json\"
            }")
          echo "HTTP status: $RESPONSE"
          cat /tmp/en_response.json
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "201" ]; then
            echo "❌ Failed to push en.json"
            exit 1
          fi
          echo "✅ en.json pushed successfully"
