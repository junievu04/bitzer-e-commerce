# Pull translations from Lokalise → tạo PR cập nhật languages/*.json
# Trigger: webhook (Lokalise) | schedule (thứ 2) | thủ công
name: Pull from Lokalise

on:
  workflow_dispatch:
  repository_dispatch:
    types: [lokalise-translation-updated]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull from Lokalise
        uses: lokalise/lokalise-pull-action@v5.0.0
        with:
          api_token: ${{ secrets.LOKALISE_API_TOKEN }}
          project_id: ${{ vars.LOKALISE_PROJECT_ID }}
          file_format: json
          translations_path: languages
          base_lang: vi_VN
          flat_naming: true
          skip_include_tags: true
          additional_params: '{"filter_langs": ["vi", "en"], "directory_prefix": "languages/", "placeholder_format": "icu", "language_mapping": [{"original_language_iso": "en", "custom_language_iso": "en"}, {"original_language_iso": "en_US", "custom_language_iso": "en"}, {"original_language_iso": "vi", "custom_language_iso": "vi"}]}'

      - name: Debug - List files after Pull
        run: |
          echo "=== Cấu trúc thư mục ==="
          find . -type f -name "*.json" | head -30
          echo ""
          echo "=== Nội dung languages/ ==="
          ls -la languages/ 2>/dev/null || echo "Không có thư mục languages"
          echo ""
          echo "=== Mẫu en.json (10 dòng đầu) ==="
          head -10 languages/en.json 2>/dev/null || echo "Không có en.json"
          echo ""
          echo "=== Mẫu vi.json (10 dòng đầu) ==="
          head -10 languages/vi.json 2>/dev/null || echo "Không có vi.json"

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet languages/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/
          git commit -m "chore: sync translations from Lokalise [skip ci]"
          git push
