# Pull translations from Lokalise → tạo PR cập nhật languages/*.json
# Trigger: webhook (Lokalise) | schedule (thứ 2) | thủ công
name: Pull from Lokalise

on:
  workflow_dispatch:
  repository_dispatch:
    types: [lokalise-translation-updated]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull from Lokalise
        uses: lokalise/lokalise-pull-action@v5.0.0
        with:
          api_token: ${{ secrets.LOKALISE_API_TOKEN }}
          project_id: ${{ vars.LOKALISE_PROJECT_ID }}
          file_format: json
          translations_path: languages
          base_lang: vi
          flat_naming: true
          skip_include_tags: true
          additional_params: >
            {
              "language_mapping": [
                {"original_language_iso": "en", "custom_language_iso": "en"},
                {"original_language_iso": "en_US", "custom_language_iso": "en"},
                {"original_language_iso": "vi", "custom_language_iso": "vi"},
                {"original_language_iso": "vi_VN", "custom_language_iso": "vi"}
              ]
            }
